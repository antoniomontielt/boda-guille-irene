    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=PT+Sans:wght@400;700&display=swap" rel="stylesheet">

</head>
<body>
    <nav class="main-nav-gallery">
        <div class="nav-content">
            <a href="index.html" class="nav-logo">C&A</a>
            <div class="nav-links">
                <a href="index.html#our-story">Nuestra Historia</a>

    <section id="galeria-boda" class="section">
  <div class="container">
    <h2><i class="fas fa-images"></i> Galería de la Boda</h2>
    <h3>Sube tus fotos de la boda y compártelas con nosotros. ¡Queremos ver todos los momentos especiales!</h3>
    <div class="file-input-container">
      <label for="imageInput" class="file-input-label">
        <i class="fas fa-camera-retro"></i> Subir Fotos
      </label>
      <input type="file" id="imageInput" accept="image/*" multiple>
      <button id="download-zip">
        <i class="fas fa-file-zipper"></i>
        Descargar album completo
      </button>
      <div id="file-name" class="file-name"></div>
    </div>
    <!-- Mosaico de fotos -->
    <div class="gallery-grid" id="gallery"></div>
    
    <!-- Lightbox para visualización ampliada -->
    <div class="lightbox" id="lightbox">
      <span class="close-btn">&times;</span>
      <span class="nav-btn prev-btn">&lt;</span>
      <span class="nav-btn next-btn">&gt;</span>
      <div class="lightbox-content">
        <img id="lightbox-image" src="" alt="Imagen ampliada">
      </div>
    </div>
  </div>
  <div id="loading-indicator" style="display: none;">
  <div class="spinner-container">
    <div class="spinner"></div>
    <p>Subiendo imagen...</p>
  </div>
  </div>
    </section>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
</body>
</html>
